<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">02 / 从 HTML 到第一帧</title><desc id="desc">向下阅读；await 是异步边界，setAnimationLoop 注册回调，不在该行立刻画完所有帧。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="850" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">02 / 从 HTML 到第一帧</text><text x="36" y="79" font-size="18" fill="#c9e1d5">向下阅读；await 是异步边界，setAnimationLoop 注册回调，不在该行立刻画完所有帧。</text><rect x="80" y="135" width="1030" height="89" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="100" y="170" font-size="22" fill="#253b36">① 浏览器解析 index.html</text><text x="100" y="201" font-size="18" fill="#4f6960">#app 就绪 → 浏览器/Vite 加载 main.js 的模块依赖</text><path d="M595,250 L595,278" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="285" width="1030" height="89" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="100" y="320" font-size="22" fill="#253b36">② main.js 同步执行</text><text x="100" y="351" font-size="18" fill="#4f6960">写入页面 → 绑定事件 → 设置文档功能 → 调用 initializeViewer()</text><path d="M595,400 L595,427" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="435" width="1030" height="89" rx="14" fill="#fff2dd" stroke="#b9d1c7"/><text x="100" y="470" font-size="22" fill="#253b36">③ await loadEye(eyeURL) · 异步等待</text><text x="100" y="501" font-size="18" fill="#4f6960">读取 GLB → 解析几何/材质/贴图 → 按九个 id 建立 groups → 返回 model</text><path d="M595,550 L595,578" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="585" width="1030" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="100" y="620" font-size="22" fill="#253b36">④ new EyeViewer(...) → 页面初始化完成</text><text x="100" y="651" font-size="18" fill="#4f6960">建场景/光照/相机 → 装模型 → 配置剖切 → 注册循环与 ResizeObserver</text><text x="100" y="680" font-size="18" fill="#4f6960">构造返回后：renderLayers() → selectPart(&quot;retina&quot;) → 开启控件</text><text x="100" y="775" font-size="22" fill="#253b36">⑤ 浏览器帧回调：controls.update → mixer.update（启用时）→ render → HTML 标注</text><text x="36" y="828" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>