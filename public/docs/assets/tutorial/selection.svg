<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">06 / 选择结构：多入口，一个出口</title><desc id="desc">关键纽带是 id：entries.id = groups 的 key = Mesh.userData.part。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="690" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">06 / 选择结构：多入口，一个出口</text><text x="36" y="79" font-size="18" fill="#c9e1d5">关键纽带是 id：entries.id = groups 的 key = Mesh.userData.part。</text><rect x="40" y="150" width="325" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="185" font-size="22" fill="#253b36">入口 A · 图层 / 标注</text><text x="60" y="216" font-size="18" fill="#4f6960">data-part / data-hotspot</text><text x="60" y="245" font-size="18" fill="#4f6960">下一个结构：id 循环</text><rect x="425" y="150" width="730" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="445" y="185" font-size="22" fill="#253b36">入口 B · 画布点击</text><text x="445" y="216" font-size="18" fill="#4f6960">位移 ≤ 5px → 像素转 NDC → Raycaster 命中</text><text x="445" y="245" font-size="18" fill="#4f6960">排除隐藏父级、已剖切点、内置透明遮挡组织</text><path d="M200,270 L520,337" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><path d="M790,270 L640,337" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="345" width="580" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="320" y="380" font-size="22" fill="#253b36">main.js → selectPart(id)</text><text x="320" y="411" font-size="18" fill="#4f6960">在当前 model.entries 中找到结构</text><text x="320" y="440" font-size="18" fill="#4f6960">调用 viewer.select(id)，同步页面显示</text><path d="M450,470 L230,530" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><path d="M750,470 L900,530" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="540" width="500" height="89" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="575" font-size="22" fill="#253b36">三维：材质高亮</text><text x="60" y="606" font-size="18" fill="#4f6960">保存原 emissive，再叠加选中色</text><rect x="635" y="540" width="520" height="89" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="655" y="575" font-size="22" fill="#253b36">二维：名称 / 描述 / 图层 / 示意图</text><text x="655" y="606" font-size="18" fill="#4f6960">外部模型不显示内置固定二维图</text><text x="36" y="668" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>