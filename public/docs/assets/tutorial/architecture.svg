<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">01 / 谁负责什么：源码与资产依赖</title><desc id="desc">实线箭头表示主要调用或数据流；下半部分只在重新导出资产时运行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="730" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">01 / 谁负责什么：源码与资产依赖</text><text x="36" y="79" font-size="18" fill="#c9e1d5">实线箭头表示主要调用或数据流；下半部分只在重新导出资产时运行。</text><rect x="40" y="140" width="260" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="175" font-size="22" fill="#253b36">index.html</text><text x="60" y="206" font-size="18" fill="#4f6960">页面挂载点 #app</text><text x="60" y="235" font-size="18" fill="#4f6960">加载 main.js</text><path d="M300,185 L365,185" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="140" width="330" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="390" y="175" font-size="22" fill="#253b36">main.js · 页面协调</text><text x="390" y="206" font-size="18" fill="#4f6960">事件 → Viewer 方法</text><text x="390" y="235" font-size="18" fill="#4f6960">选择结果 → 图文与图层</text><path d="M700,185 L785,185" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="790" y="140" width="370" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="810" y="175" font-size="22" fill="#253b36">viewer.js · 三维展示</text><text x="810" y="206" font-size="18" fill="#4f6960">场景 / 相机 / 渲染循环</text><text x="810" y="235" font-size="18" fill="#4f6960">剖切 / 拾取 / 动画 / 标注</text><path d="M535,258 L535,308" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="315" width="330" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="390" y="350" font-size="22" fill="#253b36">eye.js / import-model.js</text><text x="390" y="381" font-size="18" fill="#4f6960">GLB 或用户文件 → model</text><text x="390" y="410" font-size="18" fill="#4f6960">统一对象交给 EyeViewer</text><path d="M170,350 L360,350" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="315" width="260" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="350" font-size="22" fill="#253b36">content.js</text><text x="60" y="381" font-size="18" fill="#4f6960">结构 id 与图文</text><text x="60" y="410" font-size="18" fill="#4f6960">独立二维示意图</text><rect x="790" y="315" width="370" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="810" y="350" font-size="22" fill="#253b36">style.css / docs</text><text x="810" y="381" font-size="18" fill="#4f6960">HTML 排版与静态文档</text><text x="810" y="410" font-size="18" fill="#4f6960">不生成三维几何</text><path d="M170,568 L360,568" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="510" width="260" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="545" font-size="22" fill="#253b36">eye-source.js</text><text x="60" y="576" font-size="18" fill="#4f6960">几何 + 材质 + Canvas 纹理</text><text x="60" y="605" font-size="18" fill="#4f6960">开发时生成眼球</text><rect x="370" y="510" width="330" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="390" y="545" font-size="22" fill="#253b36">export-eye.mjs</text><text x="390" y="576" font-size="18" fill="#4f6960">浏览器运行生成器</text><text x="390" y="605" font-size="18" fill="#4f6960">GLTFExporter → 校验</text><path d="M700,563 L785,563" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="790" y="510" width="370" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="810" y="545" font-size="22" fill="#253b36">public/models/eye.glb</text><text x="810" y="576" font-size="18" fill="#4f6960">默认运行时资产</text><text x="810" y="605" font-size="18" fill="#4f6960">页面不导入生成器</text><path d="M975,500 L705,410" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="708" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>