<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">05 / 多平面剖切：被裁掉的区域</title><desc id="desc">为便于理解，下图只启用 X、Y 两轴；实际默认启用 X、Y、Z 三轴。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="700" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">05 / 多平面剖切：被裁掉的区域</text><text x="36" y="79" font-size="18" fill="#c9e1d5">为便于理解，下图只启用 X、Y 两轴；实际默认启用 X、Y、Z 三轴。</text><text x="115" y="157" font-size="24" fill="#253b36">交集：X 负侧 且 Y 负侧</text><text x="697" y="157" font-size="24" fill="#253b36">并集：X 负侧 或 Y 负侧</text><rect x="110" y="188" width="370" height="300" fill="#e4efe9"/><rect x="295" y="188" width="185" height="150" fill="#e0a18b"/><rect x="690" y="188" width="370" height="300" fill="#e4efe9"/><path d="M690 188H1060V488H875V338H690Z" fill="#e0a18b"/><path d="M110,338 L510,338" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><path d="M295,488 L295,178" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,338 L1090,338" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><path d="M875,488 L875,178" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="370" font-size="18" fill="#253b36">+X</text><text x="300" y="180" font-size="18" fill="#253b36">+Y</text><text x="1070" y="370" font-size="18" fill="#253b36">+X</text><text x="880" y="180" font-size="18" fill="#253b36">+Y</text><text x="310" y="265" font-size="24" fill="#253b36">裁掉</text><text x="130" y="438" font-size="24" fill="#253b36">保留</text><text x="915" y="265" font-size="24" fill="#253b36">裁掉</text><text x="710" y="438" font-size="24" fill="#253b36">保留</text><text x="70" y="545" font-size="21" fill="#253b36">Plane 的 normal = (−1, 0, 0)，constant = 0 时：distance = −x；x &gt; 0 才是负侧。</text><text x="70" y="585" font-size="21" fill="#253b36">默认三轴交集裁掉 x &gt; 0 且 y &gt; 0 且 z &gt; 0；没有启用轴时不裁掉任何点。</text><text x="70" y="625" font-size="21" fill="#253b36">红色表示不再绘制的片元；没有生成切口封盖，也没有修改原始几何。</text><text x="36" y="678" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>