<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865" role="img" aria-labelledby="title desc"><title id="title">07 / 导入模型与资源生命周期</title><desc id="desc">先加载成功，再替换旧模型；File / Blob URL / GPU 资源是不同层面的对象。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="865" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">07 / 导入模型与资源生命周期</text><text x="36" y="79" font-size="18" fill="#c9e1d5">先加载成功，再替换旧模型；File / Blob URL / GPU 资源是不同层面的对象。</text><rect x="40" y="135" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="170" font-size="22" fill="#253b36">① validateFiles(File[])</text><text x="60" y="201" font-size="18" fill="#4f6960">唯一主文件、唯一附件名、总大小 ≤ 100 MB</text><text x="60" y="230" font-size="18" fill="#4f6960">不是上传，也不是完整格式校验</text><path d="M570,185 L620,185" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="135" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="170" font-size="22" fill="#253b36">② Blob URL + LoadingManager</text><text x="650" y="201" font-size="18" fill="#4f6960">本地附件映射；拒绝远程 HTTP 引用</text><text x="650" y="230" font-size="18" fill="#4f6960">GLTFLoader 或 OBJLoader + MTLLoader</text><path d="M895,253 L895,288" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="295" width="530" height="147" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="330" font-size="22" fill="#253b36">③ 解析 → 检查 → 归一化</text><text x="650" y="361" font-size="18" fill="#4f6960">root（统一缩放）→ normalized（居中）</text><text x="650" y="390" font-size="18" fill="#4f6960">→ loadedRoot（保留动画原始节点）</text><text x="650" y="419" font-size="18" fill="#4f6960">每个 Mesh 建图层、克隆材质、生成 entries</text><path d="M630,370 L580,370" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="310" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="345" font-size="22" fill="#253b36">失败分支</text><text x="60" y="376" font-size="18" fill="#4f6960">不调用 replaceModel，原模型保留</text><text x="60" y="405" font-size="18" fill="#4f6960">释放已拿到的新模型；显示错误</text><path d="M895,442 L895,478" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="485" width="530" height="147" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="520" font-size="22" fill="#253b36">④ replaceModel → 更新 UI</text><text x="650" y="551" font-size="18" fill="#4f6960">停止旧动画、uncacheRoot、移除旧根</text><text x="650" y="580" font-size="18" fill="#4f6960">dispose 旧几何 / 材质 / 纹理</text><text x="650" y="609" font-size="18" fill="#4f6960">装入新模型、准备动画（初始暂停）</text><rect x="40" y="505" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="540" font-size="22" fill="#253b36">finally：撤销临时 Blob URL</text><text x="60" y="571" font-size="18" fill="#4f6960">成功、失败都 revokeObjectURL</text><text x="60" y="600" font-size="18" fill="#4f6960">不是 dispose GPU 对象的替代品</text><text x="55" y="718" font-size="21" fill="#253b36">默认 GLB 加载是另一条入口：按九个约定分组构建相同 model 对象，不做导入归一化。</text><text x="55" y="762" font-size="21" fill="#253b36">恢复示意模型：重新 loadEye → 成功后 replaceModel；恢复失败仍保留导入模型。</text><text x="36" y="843" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>