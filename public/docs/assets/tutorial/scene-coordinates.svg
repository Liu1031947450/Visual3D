<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">03 / 场景树与三种坐标</title><desc id="desc">Group 提供层级变换；Camera 决定投影；Renderer 把结果画到 Canvas。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="790" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">03 / 场景树与三种坐标</text><text x="36" y="79" font-size="18" fill="#c9e1d5">Group 提供层级变换；Camera 决定投影；Renderer 把结果画到 Canvas。</text><rect x="40" y="140" width="510" height="176" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="175" font-size="22" fill="#253b36">Scene</text><text x="60" y="206" font-size="18" fill="#4f6960">environment / lights / fog</text><text x="60" y="235" font-size="18" fill="#4f6960">grid + 渐变阴影平面 + 切面 helpers</text><text x="60" y="264" font-size="18" fill="#4f6960">model.root → 九个 Group → Mesh</text><text x="60" y="293" font-size="18" fill="#4f6960">Mesh = Geometry + Material（可引用 Texture）</text><rect x="40" y="350" width="510" height="147" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="385" font-size="22" fill="#253b36">Camera + Renderer</text><text x="60" y="416" font-size="18" fill="#4f6960">相机不必添加到 Scene 才能 render</text><text x="60" y="445" font-size="18" fill="#4f6960">renderer.render(scene, camera)</text><text x="60" y="474" font-size="18" fill="#4f6960">HTML 标注并不在 Scene 内</text><rect x="630" y="140" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="175" font-size="22" fill="#253b36">① 局部坐标 local</text><text x="650" y="206" font-size="18" fill="#4f6960">例如：某结构分组内部的锚点</text><text x="650" y="235" font-size="18" fill="#4f6960">经父级平移/旋转/缩放到世界空间</text><path d="M880,258 L880,285" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="292" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="327" font-size="22" fill="#253b36">② 世界坐标 world</text><text x="650" y="358" font-size="18" fill="#4f6960">与切面处于同一空间</text><text x="650" y="387" font-size="18" fill="#4f6960">通用变换：group.localToWorld(point)</text><path d="M880,410 L880,437" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="445" width="530" height="147" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="480" font-size="22" fill="#253b36">③ 投影坐标 NDC → 页面像素</text><text x="650" y="511" font-size="18" fill="#4f6960">world.clone().project(camera)</text><text x="650" y="540" font-size="18" fill="#4f6960">pixelX = (ndcX × 0.5 + 0.5) × width</text><text x="650" y="569" font-size="18" fill="#4f6960">pixelY = (−ndcY × 0.5 + 0.5) × height</text><text x="50" y="670" font-size="21" fill="#253b36">本项目固定锚点：基础位置 + 分组展开位移；不能泛化为任意旋转/缩放模型的变换。</text><text x="50" y="710" font-size="21" fill="#253b36">拾取走相反方向：鼠标像素 → NDC → 从 Camera 发射 Raycaster 射线。</text><text x="36" y="768" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>