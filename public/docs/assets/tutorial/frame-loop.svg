<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="title desc"><title id="title">04 / 一帧画面如何更新</title><desc id="desc">一次用户操作改变状态，下一帧读取新状态；不需要每次重建模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#448875"/></marker></defs><rect width="1200" height="745" fill="#f7faf8"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="106" fill="#174e43"/><text x="36" y="43" font-size="29" fill="#ffffff">04 / 一帧画面如何更新</text><text x="36" y="79" font-size="18" fill="#c9e1d5">一次用户操作改变状态，下一帧读取新状态；不需要每次重建模型。</text><rect x="40" y="140" width="490" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="175" font-size="22" fill="#253b36">用户输入 / 异步加载</text><text x="60" y="206" font-size="18" fill="#4f6960">相机、Plane.constant、visible</text><text x="60" y="235" font-size="18" fill="#4f6960">opacity、wireframe、animationPlaying</text><path d="M530,188 L620,188" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="140" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="175" font-size="22" fill="#253b36">计算 delta，最多 0.1 秒</text><text x="650" y="206" font-size="18" fill="#4f6960">document.hidden 时跳过实际绘制</text><text x="650" y="235" font-size="18" fill="#4f6960">时间单位：performance.now() 毫秒 → 秒</text><path d="M895,258 L895,286" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="295" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="330" font-size="22" fill="#253b36">推进状态</text><text x="650" y="361" font-size="18" fill="#4f6960">controls.update(delta)</text><text x="650" y="390" font-size="18" fill="#4f6960">animationPlaying ? mixer.update(delta)</text><path d="M895,413 L895,441" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="450" width="530" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="650" y="485" font-size="22" fill="#253b36">绘制一帧</text><text x="650" y="516" font-size="18" fill="#4f6960">renderer.render(scene, camera)</text><text x="650" y="545" font-size="18" fill="#4f6960">GPU 根据几何、光照、材质与切面出图</text><path d="M630,502 L550,502" fill="none" stroke="#448875" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="450" width="500" height="118" rx="14" fill="#e9f3ef" stroke="#b9d1c7"/><text x="60" y="485" font-size="22" fill="#253b36">投影 HTML 标注 + 统计</text><text x="60" y="516" font-size="18" fill="#4f6960">updateAnnotations() → 布局与连线</text><text x="60" y="545" font-size="18" fill="#4f6960">每约一秒更新 FPS / triangles / calls</text><text x="50" y="645" font-size="22" fill="#253b36">自动旋转是相机在动；资产动画是模型节点在动；两者不是同一个开关。</text><text x="36" y="723" font-size="16" fill="#648074">OCULUS · Three.js 零基础教程 | 概念示意，不按真实空间比例绘制</text></g></svg>